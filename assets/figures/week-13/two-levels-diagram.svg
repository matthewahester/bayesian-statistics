  <text x="630" y="131.125" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">population spread tau = 8</text>
  <text x="630" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">each stem is one zone's estimated mean</text>
  <text x="56" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Complete pooling is this picture with tau forced to zero: every zone mean sits on top of mu and the zones cannot differ at all.</text>
  <text x="56" y="452" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">No pooling is this picture with the top level deleted: a zone mean may be anywhere, and the other seven zones say nothing about it.</text>
  <text x="56" y="472" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The hierarchical model keeps both levels, so the other zones are informative without being decisive.</text>
  <text x="56" y="492" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Here mu and tau are treated as given. A full fit estimates them too, and carries that extra uncertainty into every zone.</text>
</svg>
