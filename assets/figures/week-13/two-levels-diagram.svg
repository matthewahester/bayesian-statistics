<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img">
  <title>The two levels of a hierarchical model</title>
  <desc>A column of three boxes, the population of zones, the eight zone means, and the households, joined by two arrows labelled with the two levels of variation, the across-zone spread tau and the within-zone spread sigma, beside a normal population curve centred at 78 with a spread of 8, carrying a stem for each of the eight partially pooled zone estimates.</desc>
  <rect x="0" y="0" width="840" height="520" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">One model, two levels of variation</text>
  <text x="38" y="51" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Reading down: the population of zones supplies each zone mean, and each zone mean supplies its households.</text>
  <rect x="56" y="96" width="330" height="74" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="221" y="129" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">The population of zones</text>
  <text x="221" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">theta_j drawn from Normal(mu = 78, tau = 8)</text>
  <rect x="56" y="216" width="330" height="74" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="221" y="249" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">The eight zone means</text>
  <text x="221" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">theta_1 through theta_8, one per zone</text>
  <rect x="56" y="336" width="330" height="74" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="221" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">The households</text>
  <text x="221" y="386" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">each household scatters around its zone mean, sigma = 24</text>
  <line x1="221" y1="170" x2="221" y2="206" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="221,214 224.6,206 217.4,206" fill="#1f2933"/>
  <line x1="221" y1="290" x2="221" y2="326" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="221,334 224.6,326 217.4,326" fill="#1f2933"/>
  <text x="231" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">supplies each zone mean</text>
  <text x="231" y="205" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">variation across zones, tau = 8</text>
  <text x="231" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">supplies its households</text>
  <text x="231" y="325" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">variation within a zone, sigma = 24</text>
  <line x1="470" y1="328" x2="790" y2="328" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="470" y1="118" x2="470" y2="328" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="492.857" y1="328" x2="492.857" y2="332" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="492.857" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">54</text>
  <line x1="538.571" y1="328" x2="538.571" y2="332" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="538.571" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">62</text>
  <line x1="584.286" y1="328" x2="584.286" y2="332" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="584.286" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <line x1="630" y1="328" x2="630" y2="332" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="630" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">78</text>
  <line x1="675.714" y1="328" x2="675.714" y2="332" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="675.714" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">86</text>
