<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img">
  <title>Intervals before and after partial pooling</title>
  <desc>Eight zones, each with two 95 percent intervals: the no-pooling interval from the zone's own households and the narrower partially pooled interval. Dunmore narrows from 42.3 to 73.7 down to 56.9 to 79.1; Eastgate barely changes.</desc>
