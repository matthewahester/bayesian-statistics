  <text x="38" y="51" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Each interval is the estimate plus and minus 1.96 standard deviations. Orange is the zone on its own; blue borrows from the other seven.</text>
