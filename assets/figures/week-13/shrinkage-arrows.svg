  <line x1="612.857" y1="448" x2="612.857" y2="452" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="612.857" y="465" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">90</text>
