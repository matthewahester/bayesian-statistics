<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" role="img">
  <title>Each zone mean pulled toward the population mean</title>
  <desc>Eight rows, one per zone. An open orange circle marks the zone's own survey average and a blue circle marks its partially pooled estimate, joined by an arrow whose length is the amount of shrinkage. Dunmore moves ten gallons; Eastgate moves 0.15.</desc>
  <rect x="0" y="0" width="840" height="540" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">How far each zone moves, and why</text>
  <text x="38" y="51" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Arrow length is the shrinkage. It is set by how the zone's own standard error compares with tau = 8 gallons.</text>
