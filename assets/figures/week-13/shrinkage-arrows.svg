  <text x="512" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">the partially pooled estimate</text>
  <text x="38" y="524" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Nine households in Dunmore give a standard error of exactly 8.00, the same size as tau, so its weight is exactly one half and it moves ten full gallons.</text>
</svg>
