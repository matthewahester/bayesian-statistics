<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" role="img">
  <title>What a second positive is worth when repeats are not independent</title>
  <desc>A rising curve showing the probability of the condition after two positive tests as the share of condition-free people who can react at all rises from 0.05 to 1, reaching 0.607 only at the right hand edge where repeats are independent.</desc>
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>
  <text x="390" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Two positives are worth less when the same people react twice</text>
  <text x="100" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">vertical axis: P(condition given two positives)</text>
  <rect x="100" y="68" width="570" height="286" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="100" y1="354" x2="670" y2="354" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
