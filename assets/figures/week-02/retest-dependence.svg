  <text x="128.5" y="371" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.05</text>
  <line x1="242.5" y1="354" x2="242.5" y2="358" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="242.5" y="371" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.25</text>
  <line x1="385" y1="354" x2="385" y2="358" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="385" y="371" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.50</text>
  <line x1="527.5" y1="354" x2="527.5" y2="358" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="527.5" y="371" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.75</text>
  <line x1="670" y1="354" x2="670" y2="358" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="670" y="371" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1 (independent)</text>
  <line x1="96" y1="354" x2="100" y2="354" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="92" y="357.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="96" y1="272.286" x2="100" y2="272.286" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="92" y="276.086" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.2</text>
  <line x1="96" y1="190.571" x2="100" y2="190.571" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="92" y="194.371" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.4</text>
  <line x1="96" y1="108.857" x2="100" y2="108.857" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="92" y="112.657" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.6</text>
