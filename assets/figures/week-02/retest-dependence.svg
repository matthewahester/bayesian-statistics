  <circle cx="157" cy="299.39" r="5" fill="#c2622d"/>
  <circle cx="670" cy="106.106" r="5" fill="#3f7a52"/>
  <text x="171" y="287.39" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="start">one in ten can react: 0.134</text>
  <text x="660" y="92.106" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="end">independent repeats: 0.607</text>
  <text x="100" y="434" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Every value on this curve keeps single-test performance fixed at sensitivity</text>
  <text x="100" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">0.98 and false positive rate 0.05, so no one-test number tells you where on it you are.</text>
