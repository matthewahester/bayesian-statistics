<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img">
  <title>Two different denominators in one table</title>
  <desc>A two by two table of expected counts with the condition present row shaded to give 392 of 400, which is 0.98, and the test positive column shaded to give 392 of 5,372, which is 0.073.</desc>
  <rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
  <text x="410" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Same table, two different denominators</text>
  <rect x="220" y="96" width="128" height="102" fill="#dbe6ef"/>
  <rect x="40" y="96" width="564" height="34" fill="#f3e3d6"/>
  <rect x="220" y="96" width="128" height="34" fill="#e8ddd9"/>
  <rect x="40" y="62" width="564" height="34" fill="#eef2f6"/>
  <text x="49" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold"></text>
  <text x="284" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Test positive</text>
  <text x="412" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Test negative</text>
  <text x="540" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Total</text>
  <line x1="40" y1="62" x2="604" y2="62" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Condition present</text>
  <text x="284" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">392</text>
  <text x="412" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">8</text>
  <text x="540" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">400</text>
  <line x1="40" y1="96" x2="604" y2="96" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="151.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Condition absent</text>
  <text x="284" y="151.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">4,980</text>
  <text x="412" y="151.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">94,620</text>
  <text x="540" y="151.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">99,600</text>
  <line x1="40" y1="130" x2="604" y2="130" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="185.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Total</text>
  <text x="284" y="185.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">5,372</text>
  <text x="412" y="185.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">94,628</text>
  <text x="540" y="185.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">100,000</text>
  <line x1="40" y1="164" x2="604" y2="164" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="198" x2="604" y2="198" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="220" y1="62" x2="220" y2="198" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="348" y1="62" x2="348" y2="198" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="476" y1="62" x2="476" y2="198" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="62" x2="40" y2="198" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="604" y1="62" x2="604" y2="198" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="614" y1="113" x2="631" y2="113" stroke="#c2622d" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="638,113 631,109.85 631,116.15" fill="#c2622d"/>
  <text x="646" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="start">across the row:</text>
  <text x="646" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="start">392 of 400 is 0.98</text>
  <line x1="284" y1="242" x2="284" y2="217" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="284,210 280.85,217 287.15,217" fill="#2f6f9f"/>
  <text x="284" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="middle">down the column: 392 of 5,372 is 0.073</text>
  <text x="40" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">The shaded row is the sensitivity, the probability of a positive given the condition. The</text>
  <text x="40" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">shaded column is what the patient wants, the probability of the condition given a</text>
  <text x="40" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">positive. They share the cell 392 and nothing else, which is why they are nowhere near</text>
  <text x="40" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">equal.</text>
</svg>
