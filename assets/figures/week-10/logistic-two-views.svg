<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 460" width="790" height="460" role="img">
  <title>The same logistic model on two scales</title>
  <desc>Left panel: log-odds against temperature is a straight line of slope 0.26 crossing zero at 83.46 degrees. Right panel: the same model on the probability scale is an S-shaped curve rising from 0.0998 at 75 degrees to 0.9526 at 95 degrees.</desc>
  <rect x="0" y="0" width="790" height="460" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">One model, two views: log-odds and probability</text>
  <text x="38" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">log-odds = 0.40 plus 0.26 times (temp minus 85), and probability = 1 divided by (1 plus e to the minus log-odds).</text>
