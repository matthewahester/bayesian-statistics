<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420" role="img">
  <title>A hard threshold gives three different days the same label</title>
  <desc>Three predicted advisory probabilities, 0.535 at 84 degrees, 0.765 at 88 degrees and 0.9526 at 95 degrees, all sit above the one half threshold and all collapse to the same yes label.</desc>
  <rect x="0" y="0" width="740" height="420" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">What the one half threshold throws away</text>
  <text x="38" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The fitted probability for three days, and the single label a hard cut-off gives all three.</text>
  <line x1="150" y1="296" x2="620" y2="296" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="96" x2="150" y2="296" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="296" x2="150" y2="300" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="150" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="267.5" y1="296" x2="267.5" y2="300" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="267.5" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.25</text>
  <line x1="385" y1="296" x2="385" y2="300" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="385" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.5</text>
  <line x1="502.5" y1="296" x2="502.5" y2="300" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="502.5" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.75</text>
  <line x1="620" y1="296" x2="620" y2="300" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="620" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <text x="385" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">predicted probability that an advisory is issued</text>
  <rect x="150" y="109.333" width="251.403" height="40" fill="#2f6f9f" fill-opacity="0.78"/>
  <text x="138" y="133.333" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">84 degrees</text>
  <text x="409.403" y="133.333" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">0.535</text>
  <rect x="150" y="176" width="359.55" height="40" fill="#6b5b95" fill-opacity="0.78"/>
  <text x="138" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">88 degrees</text>
  <text x="517.55" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">0.765</text>
  <rect x="150" y="242.667" width="447.722" height="40" fill="#3f7a52" fill-opacity="0.78"/>
  <text x="138" y="266.667" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">95 degrees</text>
  <text x="605.722" y="266.667" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">0.9526</text>
  <line x1="385" y1="96" x2="385" y2="296" stroke="#a33a3a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="385" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="middle">threshold at one half</text>
  <text x="150" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">All three are labelled yes. A day at 0.535 is close to a coin flip; a day at 0.9526 is not.</text>
  <text x="150" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Reporting the probability keeps that difference. Reporting the label deletes it.</text>
</svg>
