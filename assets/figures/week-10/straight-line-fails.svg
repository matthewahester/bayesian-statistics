<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" width="740" height="450" role="img">
  <title>A straight line on the probability scale leaves the unit interval</title>
  <desc>A logistic curve for the advisory probability stays between 0 and 1 across all temperatures, while the straight line that matches it at 85 degrees drops below 0 near 75.4 degrees and rises above 1 near 91.4 degrees.</desc>
  <rect x="0" y="0" width="740" height="450" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Why a probability is not modelled with a straight line</text>
  <text x="38" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Both curves agree at 85 degrees. Only one of them is still a probability away from there.</text>
