  <text x="260.583" y="399" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">80</text>
  <line x1="381" y1="382" x2="381" y2="386" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="381" y="399" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">85</text>
  <line x1="501.417" y1="382" x2="501.417" y2="386" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="501.417" y="399" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">90</text>
  <line x1="621.833" y1="382" x2="621.833" y2="386" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="621.833" y="399" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">95</text>
  <line x1="88" y1="347.2" x2="92" y2="347.2" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="351" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="88" y1="298.867" x2="92" y2="298.867" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="302.667" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.25</text>
  <line x1="88" y1="250.533" x2="92" y2="250.533" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="254.333" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.5</text>
  <line x1="88" y1="202.2" x2="92" y2="202.2" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.75</text>
  <line x1="88" y1="153.867" x2="92" y2="153.867" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="157.667" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <text x="381" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">daily maximum temperature, degrees Fahrenheit</text>
  <text x="84" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">probability</text>
