<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img">
  <title>Expected cost of each action against the exceedance probability</title>
  <desc>Two expected-cost lines drawn against the probability that use exceeds 5.0 million gallons: a flat line for staging extra capacity and a rising line for not staging, crossing at the break-even probability.</desc>
  <rect x="0" y="0" width="820" height="500" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Where the threshold comes from: two expected costs crossing</text>
  <text x="38" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Staging a crew costs 12 thousand dollars whatever happens. Being caught short costs</text>
  <text x="38" y="66" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">90 thousand, but only on a day that exceeds 5.0.</text>
  <line x1="150" y1="396" x2="690" y2="396" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="110" x2="150" y2="396" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="396" x2="690" y2="396" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="335.789" x2="690" y2="335.789" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="275.579" x2="690" y2="275.579" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="215.368" x2="690" y2="215.368" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="155.158" x2="690" y2="155.158" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="396" x2="150" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="150" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="221.982" y1="396" x2="221.982" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="221.982" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.1333</text>
  <line x1="285" y1="396" x2="285" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="285" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.25</text>
  <line x1="420" y1="396" x2="420" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="420" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.50</text>
  <line x1="555" y1="396" x2="555" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="555" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.75</text>
  <line x1="690" y1="396" x2="690" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="690" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1.00</text>
  <line x1="146" y1="396" x2="150" y2="396" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="399.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="146" y1="335.789" x2="150" y2="335.789" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="339.589" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">20</text>
  <line x1="146" y1="275.579" x2="150" y2="275.579" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="279.379" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">40</text>
  <line x1="146" y1="215.368" x2="150" y2="215.368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="219.168" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">60</text>
  <line x1="146" y1="155.158" x2="150" y2="155.158" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="158.958" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">80</text>
  <text x="420" y="434" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">probability that the day exceeds 5.0 million gallons</text>
  <text x="142" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">cost in thousands</text>
  <polyline points="150,359.874 690,359.874" fill="none" stroke="#2f6f9f" stroke-width="2.2" stroke-linejoin="round"/>
  <polyline points="150,396 690,125.053" fill="none" stroke="#c2622d" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="222" y1="396" x2="222" y2="359.874" stroke="#3f7a52" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="222" cy="359.874" r="5" fill="#3f7a52"/>
  <text x="234" y="345.874" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="start">break-even at 12 divided by 90, or 0.1333</text>
  <text x="484.8" y="215.368" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start">not staging</text>
  <text x="538.8" y="347.832" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="start">staging, always 12</text>
  <text x="186.018" y="131.074" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">do not stage</text>
  <text x="430.8" y="131.074" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">stage the extra capacity</text>
  <circle cx="151.782" cy="395.127" r="4.6" fill="#1f2933"/>
  <text x="159.782" y="387.127" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">88 deg, 0.29</text>
  <circle cx="194.712" cy="373.541" r="4.6" fill="#1f2933"/>
  <text x="202.712" y="365.541" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">90 deg, 7.46</text>
  <circle cx="404.34" cy="268.384" r="4.6" fill="#1f2933"/>
  <text x="414.34" y="258.384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">92 deg, 42.39</text>
  <circle cx="628.98" cy="155.67" r="4.6" fill="#1f2933"/>
  <text x="618.98" y="145.67" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="end">94 deg, 79.83</text>
  <text x="38" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The crossing moves whenever someone changes the two costs, and only then.</text>
</svg>
