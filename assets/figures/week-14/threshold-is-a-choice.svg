  <circle cx="162.973" cy="190.112" r="5.4" fill="#a33a3a"/>
  <text x="174.973" y="174.112" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">a 2 to 1 ratio: acting at one half, 92.11 degrees</text>
  <circle cx="305.676" cy="308.605" r="5.4" fill="#a33a3a"/>
  <text x="317.676" y="332.605" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">the stated costs: acting at 0.1333, 90.42 degrees</text>
  <text x="648" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Acting when the</text>
  <text x="648" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">probability passes one</text>
  <text x="648" y="182" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">half is not a neutral</text>
  <text x="648" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">default. It is the claim</text>
  <text x="648" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">that being caught short</text>
  <text x="648" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">costs exactly twice what</text>
  <text x="648" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">an unnecessary crew</text>
  <text x="648" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">costs.</text>
  <text x="38" y="466" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Every temperature on this curve rests on the same posterior. The horizontal axis</text>
  <text x="38" y="482" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">carries no statistics at all.</text>
</svg>
