<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img">
  <title>The acting temperature as a function of the cost ratio</title>
  <desc>A falling curve showing the weekday temperature at which the utility would stage extra capacity, drawn against the ratio of the cost of being caught short to the cost of staging capacity that is not needed.</desc>
  <rect x="0" y="0" width="880" height="490" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Change the costs and the decision moves, on identical data</text>
  <text x="38" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The break-even probability is the staging cost divided by the shortfall cost, so the</text>
  <text x="38" y="66" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">ratio on the horizontal axis fixes the temperature on the vertical one.</text>
  <line x1="150" y1="380" x2="630" y2="380" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="114" x2="150" y2="380" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="338" x2="630" y2="338" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="268" x2="630" y2="268" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="198" x2="630" y2="198" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="128" x2="630" y2="128" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="162.973" y1="380" x2="162.973" y2="384" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="162.973" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="240.811" y1="380" x2="240.811" y2="384" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="240.811" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">5</text>
  <line x1="305.676" y1="380" x2="305.676" y2="384" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="305.676" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">7.5</text>
  <line x1="370.541" y1="380" x2="370.541" y2="384" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="370.541" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="500.27" y1="380" x2="500.27" y2="384" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="500.27" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">15</text>
  <line x1="630" y1="380" x2="630" y2="384" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="630" y="397" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">20</text>
  <line x1="146" y1="338" x2="150" y2="338" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="341.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">90</text>
  <line x1="146" y1="268" x2="150" y2="268" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="271.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">91</text>
  <line x1="146" y1="198" x2="150" y2="198" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="201.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">92</text>
  <line x1="146" y1="128" x2="150" y2="128" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="131.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">93</text>
  <text x="390" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">cost of being caught short, divided by cost of unneeded staging</text>
  <text x="142" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">acting temperature</text>
