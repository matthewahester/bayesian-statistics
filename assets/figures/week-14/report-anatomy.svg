<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img">
  <title>What a usable conclusion carries that a vague one does not</title>
  <desc>A three-column table comparing a vague reported conclusion with a usable one across five things a reader needs: the question, the result with its uncertainty, the assumptions, what would change it, and the decision rule.</desc>
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text x="38" y="32" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">The same result, reported two ways</text>
  <text x="38" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Every entry in the middle column is true. None of them lets a reader do anything with it.</text>
  <rect x="38" y="88" width="800" height="38" fill="#eef2f6"/>
  <text x="47" y="111.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">What the reader needs</text>
  <text x="247" y="111.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">The vague version</text>
  <text x="497" y="111.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">The usable version</text>
  <line x1="38" y1="88" x2="838" y2="88" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="47" y="149.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the question</text>
  <text x="247" y="149.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">not stated</text>
  <text x="497" y="149.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">will a 90 degree weekday pass 5.0</text>
  <line x1="38" y1="126" x2="838" y2="126" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="38" y="164" width="800" height="38" fill="#eef2f6"/>
  <text x="47" y="187.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the result and its spread</text>
  <text x="247" y="187.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">use will be about 4.9</text>
  <text x="497" y="187.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">4.85 predicted, 0.0828 above 5.0</text>
  <line x1="38" y1="164" x2="838" y2="164" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="47" y="225.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">what it assumes</text>
  <text x="247" y="225.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">not stated</text>
  <text x="497" y="225.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Model 2, weekday, spread 0.1064</text>
  <line x1="38" y1="202" x2="838" y2="202" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="38" y="240" width="800" height="38" fill="#eef2f6"/>
  <text x="47" y="263.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">what would change it</text>
  <text x="247" y="263.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">not stated</text>
  <text x="497" y="263.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">a weekend, or the one-predictor model</text>
  <line x1="38" y1="240" x2="838" y2="240" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="47" y="301.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the rule for acting</text>
  <text x="247" y="301.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">hidden in a default</text>
  <text x="497" y="301.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">act above 0.1333, from stated costs</text>
  <line x1="38" y1="278" x2="838" y2="278" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="316" x2="838" y2="316" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="238" y1="88" x2="238" y2="316" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="488" y1="88" x2="488" y2="316" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="88" x2="38" y2="316" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="838" y1="88" x2="838" y2="316" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="38" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">The vague version is not wrong, it is unusable: a reader cannot tell whether 4.9 means the mean</text>
  <text x="38" y="339" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">of such days or one such day, cannot tell which model produced it, and cannot see that somebody</text>
  <text x="38" y="356" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">has already chosen when to act.</text>
  <text x="38" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">Weak evidence is reported the same way: state what the data do and do not separate, rather than going quiet.</text>
</svg>
