<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img">
  <title>Exceedance probability against temperature</title>
  <desc>The probability that a weekday exceeds 5.0 million gallons, drawn against the day's maximum temperature, with the four pinned values marked and two candidate decision thresholds drawn as horizontal lines.</desc>
  <rect x="0" y="0" width="820" height="500" fill="#ffffff"/>
  <text x="38" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">The probability of exceeding 5.0 million gallons on a weekday</text>
  <text x="38" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Model 2, weekday. Each marked value is a tail area past 5.0 of a normal density centred on</text>
  <text x="38" y="66" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">that day's predicted mean, with the full predictive spread, about 0.106.</text>
