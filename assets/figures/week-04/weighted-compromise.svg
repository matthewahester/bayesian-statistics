<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 448" width="790" height="448" role="img">
  <title>The posterior mean as a weighted compromise</title>
  <desc>A weight bar split 4 to 40 above a number line carrying the prior mean 0.50, the posterior mean 0.6364, and the sample proportion 0.65.</desc>
  <rect x="0" y="0" width="790" height="448" fill="#ffffff"/>
  <text x="395" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Where 0.6364 comes from</text>
  <rect x="78" y="66" width="57.636" height="42" fill="#3f7a52" stroke="#1f2933" stroke-width="1"/>
  <rect x="135.636" y="66" width="576.364" height="42" fill="#dbe6ef" stroke="#1f2933" stroke-width="1"/>
  <text x="423.818" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">the 40 planted seeds: weight 40 of 44, or 0.9091</text>
  <text x="78" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="start">prior worth 4 observations: weight 4 of 44, or 0.0909</text>
  <text x="395" y="152" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">0.0909 times 0.50 plus 0.9091 times 0.65 equals 0.6364</text>
  <line x1="118" y1="290" x2="118" y2="294" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="118" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.45</text>
  <line x1="230" y1="290" x2="230" y2="294" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="230" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.50</text>
  <line x1="342" y1="290" x2="342" y2="294" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="342" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.55</text>
  <line x1="454" y1="290" x2="454" y2="294" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="454" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.60</text>
  <line x1="566" y1="290" x2="566" y2="294" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="566" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.65</text>
  <line x1="678" y1="290" x2="678" y2="294" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="678" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.70</text>
  <text x="398" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">pi, the germination rate</text>
  <line x1="118" y1="290" x2="678" y2="290" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="230" y1="290" x2="230" y2="254" stroke="#3f7a52" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="230" cy="290" r="5.4" fill="#3f7a52"/>
  <text x="230" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle">prior mean 0.50</text>
  <line x1="566" y1="290" x2="566" y2="254" stroke="#c2622d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="566" cy="290" r="5.4" fill="#c2622d"/>
  <text x="566" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="middle">sample proportion 0.65</text>
  <line x1="535.536" y1="290" x2="535.536" y2="254" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="535.536" cy="290" r="5.4" fill="#2f6f9f"/>
  <text x="525.536" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="end">posterior mean 0.6364</text>
  <line x1="566" y1="366" x2="542.536" y2="366" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="535.536,366 542.536,369.15 542.536,362.85" fill="#5b6672"/>
  <text x="398" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">the data proportion is pulled 0.0136 toward the prior mean</text>
  <text x="78" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Nine percent of the weight sits on the prior mean and ninety-one percent on the sample</text>
  <text x="78" y="437" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">proportion, so the compromise lands close to the data.</text>
</svg>
