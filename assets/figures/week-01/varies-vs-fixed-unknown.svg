<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img">
  <title>Varies versus fixed but unknown</title>
  <desc>Two panels. The left panel shows how many loose caps appear in forty bottles when the rate is 0.05, a quantity that changes every time you inspect. The right panel shows belief spread over four candidate values of the rate itself, one fixed number.</desc>
  <rect x="0" y="0" width="920" height="430" fill="#ffffff"/>
  <text x="30" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Two different kinds of not knowing</text>
  <rect x="70" y="100" width="350" height="220" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="70" y1="320" x2="420" y2="320" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="70" y1="251.25" x2="420" y2="251.25" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="70" y1="182.5" x2="420" y2="182.5" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="70" y1="113.75" x2="420" y2="113.75" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="87.213" y1="320" x2="87.213" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="87.213" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="144.59" y1="320" x2="144.59" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="144.59" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="201.967" y1="320" x2="201.967" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="201.967" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="259.344" y1="320" x2="259.344" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="259.344" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">6</text>
  <line x1="316.721" y1="320" x2="316.721" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="316.721" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">8</text>
  <line x1="374.098" y1="320" x2="374.098" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="374.098" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="66" y1="320" x2="70" y2="320" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="323.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="66" y1="251.25" x2="70" y2="251.25" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="255.05" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.1</text>
  <line x1="66" y1="182.5" x2="70" y2="182.5" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="186.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.2</text>
  <line x1="66" y1="113.75" x2="70" y2="113.75" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="117.55" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.3</text>
  <text x="245" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">loose caps found in forty bottles</text>
  <text x="245" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">A quantity that VARIES</text>
  <rect x="76.025" y="231.648" width="22.377" height="88.352" fill="#2f6f9f"/>
  <rect x="104.713" y="133.996" width="22.377" height="186.004" fill="#2f6f9f"/>
  <rect x="133.402" y="129.101" width="22.377" height="190.899" fill="#2f6f9f"/>
  <rect x="162.09" y="192.734" width="22.377" height="127.266" fill="#2f6f9f"/>
  <rect x="190.779" y="258.041" width="22.377" height="61.959" fill="#2f6f9f"/>
  <rect x="219.467" y="296.521" width="22.377" height="23.479" fill="#2f6f9f"/>
  <rect x="248.156" y="312.792" width="22.377" height="7.208" fill="#2f6f9f"/>
  <rect x="276.844" y="318.157" width="22.377" height="1.843" fill="#2f6f9f"/>
  <rect x="305.533" y="319.6" width="22.377" height="0.4" fill="#2f6f9f"/>
  <rect x="334.221" y="319.925" width="22.377" height="0.075" fill="#2f6f9f"/>
  <rect x="362.91" y="319.988" width="22.377" height="0.012" fill="#2f6f9f"/>
  <rect x="391.598" y="319.998" width="22.377" height="0.002" fill="#2f6f9f"/>
  <text x="70" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Run the same machine, inspect forty more bottles, and</text>
  <text x="70" y="395" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the count changes. Repeat it often and the counts fill</text>
  <text x="70" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">in this shape.</text>
  <text x="70" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">if the rate really were 0.05</text>
  <rect x="570" y="100" width="300" height="220" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="570" y1="320" x2="870" y2="320" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="570" y1="220" x2="870" y2="220" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="570" y1="120" x2="870" y2="120" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="607.5" y1="320" x2="607.5" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="607.5" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.02</text>
  <line x1="682.5" y1="320" x2="682.5" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="682.5" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.05</text>
  <line x1="757.5" y1="320" x2="757.5" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="757.5" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.10</text>
  <line x1="832.5" y1="320" x2="832.5" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="832.5" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.20</text>
  <line x1="566" y1="320" x2="570" y2="320" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="562" y="323.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="566" y1="220" x2="570" y2="220" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="562" y="223.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.2</text>
  <line x1="566" y1="120" x2="570" y2="120" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="562" y="123.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.4</text>
  <text x="720" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">candidate loose-cap rate</text>
  <text x="720" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">A quantity that is FIXED but UNKNOWN</text>
  <rect x="586.5" y="170" width="42" height="150" fill="#c2622d"/>
  <text x="607.5" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">0.30</text>
  <rect x="661.5" y="120" width="42" height="200" fill="#c2622d"/>
  <text x="682.5" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">0.40</text>
  <rect x="736.5" y="220" width="42" height="100" fill="#c2622d"/>
  <text x="757.5" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">0.20</text>
  <rect x="811.5" y="270" width="42" height="50" fill="#c2622d"/>
  <text x="832.5" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">0.10</text>
  <text x="570" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">belief before any bottle is inspected</text>
  <text x="570" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The machine has ONE loose-cap rate and it does not</text>
  <text x="570" y="395" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">wobble. This spread is our uncertainty about it, not</text>
  <text x="570" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">variation in it.</text>
</svg>
