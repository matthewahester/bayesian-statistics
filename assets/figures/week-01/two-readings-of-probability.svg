  <text x="600" y="97" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">this machine has a rate of at least 0.10</text>
  <text x="600" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">This machine is installed once. There is no long</text>
