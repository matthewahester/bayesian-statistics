  <text x="75" y="97" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">one simulated run of a fair coin</text>
  <text x="75" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Probability as the share a repeatable outcome settles toward.</text>
  <text x="75" y="395" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Two early tails put the share at zero, then it settles into a</text>
