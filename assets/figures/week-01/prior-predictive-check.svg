  <text x="489.024" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="middle" font-weight="bold">observed: nine</text>
  <text x="520" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">restricted prior (bars)</text>
  <text x="520" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">open prior (dashed line)</text>
  <text x="75" y="393" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Under the restricted prior, nine or more loose caps had probability 0.0032, about three chances in a</text>
  <text x="75" y="408" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">thousand. Under the open prior it was 0.0438. The posterior from the restricted prior still looked</text>
  <text x="75" y="423" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">tidy and confident, so the posterior was never going to raise the alarm. This picture did.</text>
</svg>
