<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 450" width="950" height="450" role="img">
  <title>Prior predictive check on the restricted prior</title>
  <desc>Bars give the number of loose caps in forty bottles that the restricted prior expects, concentrated between zero and four. Circles give the same distribution under the open prior. The observed nine sits far out in the right tail of both.</desc>
  <rect x="0" y="0" width="950" height="450" fill="#ffffff"/>
  <text x="30" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Would this prior have expected the data we then saw?</text>
  <rect x="75" y="100" width="700" height="235" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="75" y1="335" x2="775" y2="335" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
