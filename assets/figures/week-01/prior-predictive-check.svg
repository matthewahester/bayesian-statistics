  <text x="232.927" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <line x1="360.976" y1="335" x2="360.976" y2="339" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="360.976" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">6</text>
  <line x1="489.024" y1="335" x2="489.024" y2="339" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="489.024" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">9</text>
  <line x1="617.073" y1="335" x2="617.073" y2="339" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="617.073" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">12</text>
  <line x1="745.122" y1="335" x2="745.122" y2="339" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="745.122" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">15</text>
  <line x1="71" y1="335" x2="75" y2="335" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="67" y="338.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="71" y1="256.667" x2="75" y2="256.667" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="67" y="260.467" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.1</text>
  <line x1="71" y1="178.333" x2="75" y2="178.333" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="67" y="182.133" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.2</text>
  <line x1="71" y1="100" x2="75" y2="100" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="67" y="103.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.3</text>
  <text x="425" y="373" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">loose caps in forty bottles, predicted before inspecting</text>
