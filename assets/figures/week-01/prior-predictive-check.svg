  <rect x="390.427" y="325.026" width="26.463" height="9.974" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="433.11" y="330.658" width="26.463" height="4.342" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
