  <rect x="561.159" y="334.829" width="26.463" height="0.171" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="603.841" y="334.954" width="26.463" height="0.046" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="646.524" y="334.989" width="26.463" height="0.011" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
