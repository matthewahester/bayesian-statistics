  <text x="70" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The predictive standard deviation is about 3.3 times the posterior standard deviation, because a new hour carries the Poisson scatter on top of what is still unknown about lambda.</text>
  <text x="70" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Both pictures come from the same fitted model. They answer different questions, and only one of them is about the parameter.</text>
