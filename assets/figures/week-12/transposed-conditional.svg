<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img">
  <title>Two different fractions of the same table</title>
  <desc>A two-way table of one hundred thousand screened people, with an arrow along the no-condition row giving the false positive rate 0.05 and an arrow down the test-positive column giving the posterior probability 0.0730.</desc>
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="300" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Ridgeline Clinic, per 100,000 people screened</text>
  <rect x="40" y="48" width="570" height="42" fill="#eef2f6"/>
  <text x="49" y="73.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold"></text>
  <text x="341" y="73.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">tests positive</text>
  <text x="471" y="73.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">tests negative</text>
  <text x="601" y="73.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">row total</text>
  <line x1="40" y1="48" x2="610" y2="48" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">has the condition</text>
  <text x="341" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">392</text>
  <text x="471" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">8</text>
  <text x="601" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">400</text>
  <line x1="40" y1="90" x2="610" y2="90" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="157.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">does not have it</text>
  <text x="341" y="157.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">4,980</text>
  <text x="471" y="157.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">94,620</text>
  <text x="601" y="157.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">99,600</text>
  <line x1="40" y1="132" x2="610" y2="132" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">column total</text>
  <text x="341" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">5,372</text>
  <text x="471" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">94,628</text>
  <text x="601" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">100,000</text>
  <line x1="40" y1="174" x2="610" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="216" x2="610" y2="216" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="220" y1="48" x2="220" y2="216" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="350" y1="48" x2="350" y2="216" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="480" y1="48" x2="480" y2="216" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="48" x2="40" y2="216" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="610" y1="48" x2="610" y2="216" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="40" y="132" width="570" height="42" fill="#f3e3d6" fill-opacity="0.55"/>
  <rect x="40" y="132" width="570" height="42" fill="none" rx="3" stroke="#c2622d" stroke-width="1.6"/>
  <rect x="220" y="48" width="130" height="168" fill="none" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="612" y1="153" x2="683" y2="153" stroke="#c2622d" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="690,153 683,149.85 683,156.15" fill="#c2622d"/>
  <text x="698" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">Along the row: 4,980 of the 99,600</text>
  <text x="698" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">people without the condition still</text>
  <text x="698" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">test positive. That fraction is</text>
  <text x="698" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">0.05, the false positive rate, and</text>
  <text x="698" y="182" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">it is the kind of number a p-value</text>
  <text x="698" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">is built from.</text>
  <line x1="285" y1="226" x2="285" y2="281" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="285,288 288.15,281 281.85,281" fill="#2f6f9f"/>
  <text x="40" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">Down the column: of the 5,372 people who test positive, 392 actually</text>
  <text x="40" y="328" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">have the condition. That fraction is 392 divided by 5,372, which is</text>
  <text x="40" y="344" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">0.0730, and it is the posterior probability the patient asked about.</text>
  <line x1="40" y1="386" x2="900" y2="386" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="40" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">Same table, same four counts, two fractions taken in different directions: 0.05 along the row and 0.0730 down</text>
  <text x="40" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">the column. Swapping one for the other is the mistake this week is about.</text>
</svg>
