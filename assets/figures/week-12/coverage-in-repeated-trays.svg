  <text x="130" y="516" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Each row is a different hypothetical tray from the SAME lot. The recipe is fixed; the data move, so the interval moves.</text>
  <text x="130" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">In this run of twenty trays, 19 intervals cover 0.65 and 1 miss.</text>
  <text x="130" y="556" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Summing over all forty-one possible trays, the exact long-run coverage of this recipe when pi is 0.65 is 0.9525.</text>
  <text x="130" y="576" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start" font-style="italic">No single row is 95 percent likely to be right. The 95 percent belongs to the whole column of rows.</text>
