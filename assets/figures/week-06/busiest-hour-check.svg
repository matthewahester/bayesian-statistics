  <text x="161.122" y="341" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <line x1="197.707" y1="324" x2="197.707" y2="328" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="197.707" y="341" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="234.293" y1="324" x2="234.293" y2="328" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="234.293" y="341" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">5</text>
  <line x1="270.878" y1="324" x2="270.878" y2="328" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="270.878" y="341" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">6</text>
