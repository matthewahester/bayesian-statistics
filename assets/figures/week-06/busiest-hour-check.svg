  <line x1="344.049" y1="324" x2="344.049" y2="328" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="344.049" y="341" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">8</text>
  <line x1="62" y1="324" x2="66" y2="324" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="58" y="327.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
