  <line x1="62" y1="204" x2="66" y2="204" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="58" y="207.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">8</text>
  <line x1="62" y1="144" x2="66" y2="144" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="58" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">12</text>
  <line x1="62" y1="84" x2="66" y2="84" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="58" y="87.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">16</text>
  <text x="216" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">hour of the shift</text>
  <text x="58" y="72" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">calls</text>
  <text x="216" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">What actually happened</text>
