  <text x="76" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">The rate is pinned down to about seven-tenths of a call per hour of posterior spread. A single hour is not, because it carries the Poisson scatter as well: the predictive spread is about 3.3 times that.</text>
  <text x="76" y="480" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">A report that quotes the narrow number when the reader asked the wide question has described a different quantity.</text>
