  <circle cx="222.462" cy="195.272" r="4.6" fill="#2f6f9f"/>
  <circle cx="265.923" cy="122.679" r="4.6" fill="#2f6f9f"/>
  <circle cx="326.769" cy="155.103" r="4.6" fill="#c2622d"/>
  <circle cx="396.308" cy="260.506" r="4.6" fill="#c2622d"/>
  <line x1="225.938" y1="183.272" x2="259.301" y2="116.932" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="262.446,110.679 256.487,115.517 262.115,118.348" fill="#2f6f9f"/>
  <line x1="330.246" y1="143.103" x2="389.257" y2="242.487" stroke="#c2622d" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="392.831,248.506 391.965,240.879 386.548,244.095" fill="#c2622d"/>
  <text x="74.692" y="89.632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="start" font-weight="bold">4.2 to 4.7: uphill</text>
  <text x="74.692" y="106.25" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">ratio 1.67, always accept</text>
  <text x="322.423" y="89.632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="start" font-weight="bold">5.4 to 6.2: downhill</text>
  <text x="322.423" y="106.25" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">ratio 0.29, so accept it about</text>
  <text x="322.423" y="121.871" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">three times in ten, else stay</text>
  <rect x="576" y="78" width="316" height="46" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="734" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">1. Stand somewhere</text>
  <text x="734" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">the chain has a current value</text>
  <line x1="734" y1="124" x2="734" y2="131" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="734,138 737.15,131 730.85,131" fill="#5b6672"/>
  <rect x="576" y="138" width="316" height="46" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="734" y="157" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">2. Propose a nearby value</text>
  <text x="734" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">a small random step away from it</text>
  <line x1="734" y1="184" x2="734" y2="191" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="734,198 737.15,191 730.85,191" fill="#5b6672"/>
  <rect x="576" y="198" width="316" height="46" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="734" y="217" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">3. Compare the two densities</text>
  <text x="734" y="234" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">a ratio needs no normalizing constant</text>
  <line x1="734" y1="244" x2="734" y2="251" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="734,258 737.15,251 730.85,251" fill="#5b6672"/>
  <rect x="576" y="258" width="316" height="46" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="734" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">4. Accept, or stay put</text>
  <text x="734" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">record a value either way</text>
  <line x1="892" y1="101" x2="916" y2="101" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="916" y1="101" x2="916" y2="281" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="916" y1="281" x2="901" y2="281" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="894,281 901,284.15 901,277.85" fill="#5b6672"/>
  <text x="576" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">The rule, in four steps</text>
  <text x="66" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Uphill moves are always taken and downhill moves are taken in proportion to the density they give up, so over a long run the chain lingers where the posterior is high.</text>
  <text x="66" y="392" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Only a ratio of densities is ever needed, which is why the normalizing constant p(y) never has to be computed.</text>
  <text x="66" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">A step size that is too small or too large still visits correctly, but it takes far longer to get anywhere.</text>
</svg>
