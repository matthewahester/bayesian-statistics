  <line x1="62" y1="171.059" x2="66" y2="171.059" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="58" y="174.859" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.4</text>
  <line x1="62" y1="104.588" x2="66" y2="104.588" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="58" y="108.388" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.6</text>
  <text x="292" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">calls per hour (lambda)</text>
  <text x="292" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">One move, two cases</text>
