<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 430" width="950" height="430" role="img">
  <title>The proposal and accept rule that makes a chain visit in proportion to density</title>
  <desc>Left: the posterior curve with an uphill move always accepted and a downhill move accepted with probability equal to the density ratio. Right: the four steps of the rule drawn as a loop.</desc>
