  <line x1="465.846" y1="304" x2="465.846" y2="308" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="465.846" y="321" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">7</text>
  <line x1="62" y1="304" x2="66" y2="304" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="58" y="307.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
