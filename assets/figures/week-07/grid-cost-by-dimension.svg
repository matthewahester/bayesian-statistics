<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" role="img">
  <title>Grid values needed at one hundred values per parameter</title>
  <desc>A bar chart on a ten-fold scale: one parameter needs one hundred grid values, two need ten thousand, and five need ten billion.</desc>
  <rect x="0" y="0" width="880" height="404" fill="#ffffff"/>
  <line x1="108" y1="302" x2="798" y2="302" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="108" y1="72" x2="108" y2="302" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="108" y1="260.182" x2="798" y2="260.182" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="108" y1="218.364" x2="798" y2="218.364" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="108" y1="176.545" x2="798" y2="176.545" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="108" y1="134.727" x2="798" y2="134.727" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="108" y1="92.909" x2="798" y2="92.909" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="187.615" y1="302" x2="187.615" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="187.615" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="320.308" y1="302" x2="320.308" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="320.308" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="453" y1="302" x2="453" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="453" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <line x1="585.692" y1="302" x2="585.692" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="585.692" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="718.385" y1="302" x2="718.385" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="718.385" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">5</text>
  <line x1="104" y1="260.182" x2="108" y2="260.182" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="100" y="263.982" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">100</text>
  <line x1="104" y1="218.364" x2="108" y2="218.364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="100" y="222.164" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">10 thousand</text>
  <line x1="104" y1="176.545" x2="108" y2="176.545" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="100" y="180.345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1 million</text>
  <line x1="104" y1="134.727" x2="108" y2="134.727" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="100" y="138.527" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">100 million</text>
  <line x1="104" y1="92.909" x2="108" y2="92.909" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="100" y="96.709" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">10 billion</text>
  <text x="453" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">number of unknown parameters in the model</text>
  <text x="453" y="58" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Cost of a grid with one hundred values per parameter</text>
  <rect x="150.462" y="260.182" width="74.308" height="41.818" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="283.154" y="218.364" width="74.308" height="83.636" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="415.846" y="176.545" width="74.308" height="125.455" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="548.538" y="134.727" width="74.308" height="167.273" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="681.231" y="92.909" width="74.308" height="209.091" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <text x="187.615" y="251.182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">100</text>
  <text x="320.308" y="209.364" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">10,000</text>
  <text x="453" y="167.545" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">1,000,000</text>
  <text x="585.692" y="125.727" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">100 million</text>
  <text x="718.385" y="83.909" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">10 billion</text>
  <text x="453" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Every extra parameter multiplies the work by one hundred</text>
  <text x="108" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Week 9 fits three unknowns; Week 13 fits one mean per zone, eight in all. A grid is fine for one parameter, hopeless by five.</text>
  <text x="108" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Worse, almost every cell of a large grid sits where the posterior is nearly zero, so nearly all of the work is spent on nothing.</text>
</svg>
