  <text x="64" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Centring changes nothing about the fit: the slope is 0.0724 and the residual standard deviation is 0.2957 in both panels.</text>
  <text x="64" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">It changes only what the intercept means. On the left it is an extrapolation to a temperature no summer day reaches.</text>
  <text x="64" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">On the right it is average daily use, a quantity a utility planner can hold an opinion about in advance.</text>
